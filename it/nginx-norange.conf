# A server that refuses to serve byte ranges: `max_ranges 0` makes nginx answer
# a ranged GET with the whole body and 200 instead of 206. Plenty of real
# origins behave this way (CDNs with transforms, some object gateways), and the
# Parquet reader has to stay correct on them — it keeps the one body it got
# rather than refetching the object for every chunk.
server {
    listen 80;
    server_name _;
    max_ranges 0;

    location / {
        root /usr/share/nginx/html;
    }
}
