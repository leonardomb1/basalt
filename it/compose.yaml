# Throwaway databases for the integration suite (it/run.sh). Host ports are
# offset (3xxxx) so a locally running DB never collides. Credentials are
# container-lifetime only — nothing here is a real secret.
services:
  mysql:
    image: mysql:8.4
    command: --local-infile=ON # LoadDataSink uses LOAD DATA LOCAL INFILE
    environment:
      MYSQL_ROOT_PASSWORD: it
      MYSQL_DATABASE: it
    ports: ["33306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -pit"]
      interval: 2s
      timeout: 2s
      retries: 60

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: it
      POSTGRES_DB: it
    ports: ["35432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "It_Passw0rd1"
    ports: ["31433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -U sa -P It_Passw0rd1 -Q 'select 1' -b"]
      interval: 3s
      timeout: 3s
      retries: 60

  # Azure Blob emulator. ADLS Gen2 data is read through the Blob endpoint, which
  # is all Azurite implements — it has no DFS endpoint and no hierarchical
  # namespace, and upstream has rejected PRs adding them.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["31000:10000"]
    healthcheck:
      # 403 = alive and demanding a signature, which is the healthy state here;
      # an unauthenticated probe never gets 200.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 2s
      timeout: 2s
      retries: 30

  # S3 emulator. SeaweedFS speaks real S3 — SigV4, ListObjectsV2, ranged GETs,
  # multipart uploads — so it exercises the same surface AWS would. It starts
  # with no buckets; the suite creates basalt-it itself via `weed shell`.
  # Credentials are the stock dev pair, not a secret. SeaweedFS rather than MinIO:
  # MinIO stopped publishing community images in 2025, so `minio/minio` no
  # longer pulls. One identity with the suite's fixed keys; small volumes keep
  # the footprint down.
  s3:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["sh", "-c"]
    command:
      - >-
        printf '%s' '{"identities":[{"name":"it","credentials":[{"accessKey":"minioadmin","secretKey":"minioadmin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json
        -master.volumeSizeLimitMB=64 -volume.max=20
    ports: ["39000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60

  # Static file server for the remote-read tests: serves the committed Parquet
  # fixtures over plain HTTP. nginx honours `Range`, which is the half of the
  # reader worth testing — the whole-object fallback is exercised by pointing
  # the same test at a URL it cannot HEAD.
  static:
    image: nginx:alpine
    volumes:
      - ../src/connect/testdata:/usr/share/nginx/html:ro
    ports: ["38080:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/snappy.parquet"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The same fixtures from an origin that refuses ranges (see nginx-norange.conf),
  # so the reader's whole-object fallback is covered by a test rather than by
  # hope. It is the path where a stale buffer would go unnoticed.
  static-norange:
    image: nginx:alpine
    volumes:
      - ../src/connect/testdata:/usr/share/nginx/html:ro
      - ./nginx-norange.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["38081:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/snappy.parquet"]
      interval: 2s
      timeout: 2s
      retries: 30

  starrocks:
    image: starrocks/allin1-ubuntu:3.3-latest
    ports: ["39030:9030", "38040:8040"]
    healthcheck:
# FE answers SQL long before a BE registers; stream load needs an alive BE.
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'show backends\\G' | grep -q 'Alive: true'"]
      interval: 5s
      timeout: 5s
      retries: 120

  # OpenSSH, for the sftp suite: a password and a key login (the key is made per
  # run by run.sh, so nothing secret is kept here), sftp jailed to /config.
  sftp:
    image: linuxserver/openssh-server:10.3_p1-r1-ls237
    ports: ["42222:2222"]
    environment:
      PUID: "1000"
      PGID: "1000"
      USER_NAME: basalt
      USER_PASSWORD: it
      PASSWORD_ACCESS: "true"
      PUBLIC_KEY: ${SFTP_PUBKEY:-}
    healthcheck:
      test: ["CMD-SHELL", "test -f /config/ssh_host_keys/ssh_host_ed25519_key.pub && pgrep -f 'sshd' >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 60

  doris:
    image: apache/doris:all-in-one-4.1.3
    ports: ["49030:9030", "48040:8040"]
    healthcheck:
# As StarRocks: the FE takes queries before its BE is alive to load.
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'show backends\\G' | grep -q 'Alive: true'"]
      interval: 5s
      timeout: 5s
      retries: 120
