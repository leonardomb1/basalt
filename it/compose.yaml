# Throwaway databases for the integration suite (it/run.sh). Host ports are
# offset (3xxxx) so a locally running DB never collides. Credentials are
# container-lifetime only — nothing here is a real secret.
services:
  mysql:
    image: mysql:8.4
    command: --local-infile=ON # LoadDataSink uses LOAD DATA LOCAL INFILE
    environment:
      MYSQL_ROOT_PASSWORD: it
      MYSQL_DATABASE: it
    ports: ["33306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -pit"]
      interval: 2s
      timeout: 2s
      retries: 60

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: it
      POSTGRES_DB: it
    ports: ["35432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "It_Passw0rd1"
    ports: ["31433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -U sa -P It_Passw0rd1 -Q 'select 1' -b"]
      interval: 3s
      timeout: 3s
      retries: 60

  # Azure Blob emulator. ADLS Gen2 data is read through the Blob endpoint, which
  # is all Azurite implements — it has no DFS endpoint and no hierarchical
  # namespace, and upstream has rejected PRs adding them.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["31000:10000"]
    healthcheck:
      # 403 = alive and demanding a signature, which is the healthy state here;
      # an unauthenticated probe never gets 200.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Static file server for the remote-read tests: serves the committed Parquet
  # fixtures over plain HTTP. nginx honours `Range`, which is the half of the
  # reader worth testing — the whole-object fallback is exercised by pointing
  # the same test at a URL it cannot HEAD.
  static:
    image: nginx:alpine
    volumes:
      - ../src/connect/testdata:/usr/share/nginx/html:ro
    ports: ["38080:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/snappy.parquet"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The same fixtures from an origin that refuses ranges (see nginx-norange.conf),
  # so the reader's whole-object fallback is covered by a test rather than by
  # hope. It is the path where a stale buffer would go unnoticed.
  static-norange:
    image: nginx:alpine
    volumes:
      - ../src/connect/testdata:/usr/share/nginx/html:ro
      - ./nginx-norange.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["38081:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/snappy.parquet"]
      interval: 2s
      timeout: 2s
      retries: 30

  starrocks:
    image: starrocks/allin1-ubuntu:3.3-latest
    ports: ["39030:9030", "38040:8040"]
    healthcheck:
# FE answers SQL long before a BE registers; stream load needs an alive BE.
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'show backends\\G' | grep -q 'Alive: true'"]
      interval: 5s
      timeout: 5s
      retries: 120
