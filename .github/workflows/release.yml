name: Release

# Releases only: a `v*` tag runs the full test gate, the release cross-build, the
# container image and the release asset. Day-to-day checks are in ci.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A tag run is never cancelled by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-zig

      - name: Check formatting
        run: zig fmt --check src tests tools build.zig

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      # The exact bytes tested here are what `image` ships and `release` attaches.
      - name: Release cross-build
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux-musl -Dcpu=x86_64_v3+aes+pclmul -Dstrip=true
          cp zig-out/bin/basalt basalt-x86_64-linux
          sha256sum basalt-x86_64-linux > basalt-x86_64-linux.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: basalt-x86_64-linux
          path: |
            basalt-x86_64-linux
            basalt-x86_64-linux.sha256
          if-no-files-found: error
          retention-days: 7

  image:
    # Publish the container image for a tag; a manual run only tests and builds.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Images come only from tags, so `latest` and the latest release are the
          # same code.
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Attach the tested static binary as a release asset on tags, so it can be run
  # directly (e.g. downloaded + executed in a Windmill bash step — no container).
  # No rebuild: the asset is byte-identical to what `test` built and exercised.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested binary
        uses: actions/download-artifact@v4
        with:
          name: basalt-x86_64-linux

      - name: Verify checksum
        run: sha256sum -c basalt-x86_64-linux.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            basalt-x86_64-linux
            basalt-x86_64-linux.sha256
