name: CI

# The light check for main and pull requests: formatting, the unit and e2e tests,
# and the book's SQL examples (so docs/ is not ignored). Releases (cross-build,
# image, assets) run from release.yml on tags.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-zig

      - name: Check formatting
        run: zig fmt --check src tests tools build.zig

      - name: Test
        run: zig build test
