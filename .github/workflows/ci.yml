name: CI

# Doc-only changes don't build. Path filters are never evaluated for tag
# pushes, so releases always run regardless of what the tagged commit touched.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'language.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'language.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.15.2

# Superseded runs on the same branch/PR are cancelled; tag runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Install Zig directly from the official release (tarball naming is arch-first
      # since 0.14.1: zig-<arch>-<os>-<version>); avoids stale third-party actions.
      - name: Cache Zig
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ~/.zig
          key: zig-${{ env.ZIG_VERSION }}-x86_64-linux

      - name: Install Zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C ~/.zig --strip-components=1

      - name: Add Zig to PATH
        run: echo "$HOME/.zig" >> "$GITHUB_PATH"

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      # The exact bytes tested here are what `image` ships and `release` attaches.
      - name: Release cross-build
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux-musl -Dstrip=true
          cp zig-out/bin/basalt basalt-x86_64-linux
          sha256sum basalt-x86_64-linux > basalt-x86_64-linux.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: basalt-x86_64-linux
          path: |
            basalt-x86_64-linux
            basalt-x86_64-linux.sha256
          if-no-files-found: error
          retention-days: 7

  image:
    # Build & publish the container image on pushes to main and on tags; PRs only test.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` follows tags, not main: the image latest and the release
          # latest always point at the same code. Main pushes get `main` + sha.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Attach the tested static binary as a release asset on tags, so it can be run
  # directly (e.g. downloaded + executed in a Windmill bash step — no container).
  # No rebuild: the asset is byte-identical to what `test` built and exercised.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested binary
        uses: actions/download-artifact@v4
        with:
          name: basalt-x86_64-linux

      - name: Verify checksum
        run: sha256sum -c basalt-x86_64-linux.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            basalt-x86_64-linux
            basalt-x86_64-linux.sha256
